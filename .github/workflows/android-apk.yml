name: Android APK


on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL for the app"
        required: false
        default: "http://10.0.2.2:3000"


jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
      - name: Install Pillow
        run: pip install pillow
      - name: Generate launcher icons and app logo
        run: python3 .github/scripts/generate_assets.py
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'http://10.0.2.2:3000' }}
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: splitnest-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
